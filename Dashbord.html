<html>
<head>
    <title>Automation Dashboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f4f6f9;
            padding: 40px;
        }

        h1 {
            color: #333;
        }

        .container {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            margin-top: 30px;
        }

        .btn {
            display: inline-block;
            width: 220px;
            padding: 20px;
            text-decoration: none;
            color: white;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            transition: 0.3s;
        }

        .btn-a {
            background: #007bff;
        }

        .btn-b {
            background: #28a745;
        }

        .btn-c {
            background: #dc3545;
        }

        .btn:hover {
            transform: scale(1.05);
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <h1>Automation Dashboard</h1>
    <p>Select an automation suite</p>

    <div class="container">
        <a class="btn btn-a"
           href="https://github.com/your-org/automation-A"
           target="_blank">
           Automation A
        </a>

        <a class="btn btn-b"
           href="https://github.com/your-org/automation-B"
           target="_blank">
           Automation B
        </a>

        <a class="btn btn-c"
           href="https://github.com/your-org/automation-C"
           target="_blank">
           Automation C
        </a>
    </div>

</body>
</html>
